name: "💡 Feature Request"
description: "Suggest a new feature, workflow improvement, or capability for Imava."
title: "[Feature]: "
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Imava even better? We'd love to hear it!
        Imava is strictly 100% offline and privacy-first (0 network permissions).
        Feature requests that require third-party cloud servers or telemetry will be declined.

  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: "Is your feature request related to a problem or limitation? A clear and concise description of what the problem is."
      placeholder: "e.g., I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the solution you'd like to see implemented."
      placeholder: "Describe how this feature should look and work..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "A clear and concise description of any alternative solutions or features you've considered."
      placeholder: "e.g., Currently I use..."

  - type: textarea
    id: visual_examples
    attributes:
      label: "Mockups / Screenshots / References"
      description: "Add any mockups, diagrams, or references from other privacy-respecting apps."
      placeholder: "Drag and drop images here..."

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: "Privacy & Offline Architecture Alignment"
      options:
        - label: "This feature functions 100% locally and offline without requiring network permissions or remote servers."
          required: true
        - label: "I have checked existing feature requests and discussions to ensure this is not a duplicate."
          required: true
