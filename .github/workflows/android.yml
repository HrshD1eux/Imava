name: Build, Sign & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract & Compute Release Version
        id: extract_version
        run: |
          python3 -c "
          import os, re, subprocess

          with open('app/build.gradle.kts', 'r') as f:
              gradle_text = f.read()

          code_match = re.search(r'versionCode\s*=\s*(\d+)', gradle_text)
          name_match = re.search(r'versionName\s*=\s*\"([^\"]+)\"', gradle_text)

          base_code = int(code_match.group(1)) if code_match else 63
          base_name = name_match.group(1) if name_match else '1.1.62'

          # Fetch remote tags to check for existing release collisions
          subprocess.run(['git', 'fetch', '--tags', '--force'], check=False)
          try:
              tags_output = subprocess.check_output(['git', 'tag', '-l', 'v*'], text=True).splitlines()
              existing_tags = set(t.strip() for t in tags_output if t.strip())
          except Exception:
              existing_tags = set()

          target_name = base_name
          target_code = base_code

          # If the tag already exists on GitHub, increment patch version to guarantee a new release
          while f'v{target_name}' in existing_tags:
              match = re.match(r'^(\d+\.\d+\.)(\d+)$', target_name)
              if match:
                  prefix = match.group(1)
                  patch = int(match.group(2)) + 1
                  target_name = f'{prefix}{patch}'
                  target_code += 1
              else:
                  break

          if target_name != base_name or target_code != base_code:
              gradle_text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {target_code}', gradle_text)
              gradle_text = re.sub(r'versionName\s*=\s*\"[^\"]+\"', f'versionName = \"{target_name}\"', gradle_text)
              with open('app/build.gradle.kts', 'w') as f:
                  f.write(gradle_text)
              print(f'Detected existing release tag! Auto-incremented to new release: {target_name} (code: {target_code})')
          else:
              print(f'Using release version: {target_name} (code: {target_code})')

          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f'VERSION_NAME={target_name}\n')
              env_file.write(f'VERSION_CODE={target_code}\n')
          "

      - name: Configure Keystore & Signing
        id: setup_keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 -c "
          import os, base64
          data = os.environ.get('RELEASE_KEYSTORE_BASE64', '').strip().replace(' ', '').replace('\n', '').replace('\r', '')
          if data:
              missing_padding = len(data) % 4
              if missing_padding:
                  data += '=' * (4 - missing_padding)
              with open('gallery-release.jks', 'wb') as f:
                  f.write(base64.b64decode(data))
              with open('keystore.properties', 'w') as f:
                  f.write(f'''storeFile=gallery-release.jks\nstorePassword={os.environ.get('RELEASE_KEYSTORE_PASSWORD')}\nkeyAlias={os.environ.get('RELEASE_KEY_ALIAS')}\nkeyPassword={os.environ.get('RELEASE_KEY_PASSWORD')}\n''')
              print('Keystore decoded and keystore.properties configured.')
          else:
              print('No RELEASE_KEYSTORE_BASE64 secret provided.')
          "

      - name: Run Tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        id: build_apk
        run: |
          if [ -f "keystore.properties" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            echo "No keystore secrets found, building Debug APK..."
            ./gradlew assembleDebug
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            # Fallback search for any built APK
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          
          echo "Found APK at: ${APK_PATH}"
          echo "APK_PATH=${APK_PATH}" >> $GITHUB_ENV

      - name: Rename APK for Distribution
        run: |
          DIST_NAME="Imava-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "$DIST_NAME"
          echo "DIST_APK=${DIST_NAME}" >> $GITHUB_ENV
          echo "Prepared $DIST_NAME for distribution."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Imava-v${{ env.VERSION_NAME }}
          path: ${{ env.DIST_APK }}
          if-no-files-found: error

      - name: Prepare Release Notes
        id: prep_release_notes
        run: |
          python3 scripts/generate_release_notes.py --version "${{ env.VERSION_NAME }}" --output release_body.md
          echo "Generated release notes:"
          cat release_body.md

      - name: Create Git Tag & GitHub Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Imava v${{ env.VERSION_NAME }}
          body_path: release_body.md
          generate_release_notes: true
          files: ${{ env.DIST_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Version Back to Repository
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add app/build.gradle.kts
          if ! git diff --staged --quiet; then
            git commit -m "chore: release version ${{ env.VERSION_NAME }} [skip ci]"
            for i in 1 2 3 4 5; do
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }} || git rebase --abort
              git push origin HEAD:${{ github.ref_name }} && echo "Successfully pushed version bump" && break || sleep 2
            done
          else
            echo "Version in build.gradle.kts already up to date with release."
          fi
